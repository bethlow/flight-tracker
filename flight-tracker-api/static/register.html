<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — Our Travels</title>
<link rel="stylesheet" href="/theme.css">
<style>
main{max-width:420px;margin:0 auto;padding:18px 16px 40px}
input,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:9px;background:var(--bg);color:var(--ink);min-width:0;width:100%;margin-bottom:8px}
</style></head><body><main>

<div class="card">
  <h1>Create account</h1><p class="sub">Start a shared logbook for you and a partner.</p>
  <form id="f">
    <input id="name" placeholder="Your name" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="pw" type="password" placeholder="Password (8+ characters)" minlength="8" required>
    <button id="go">Create account</button>
  </form>
  <div class="err" id="err"></div>
  <p class="sub"><a href="/">Already have an account? Sign in</a></p>
</div>

<script src="/common.js"></script>
<script>
$('f').onsubmit = async e => {
  e.preventDefault();
  $('err').textContent = '';
  try {
    const {token} = await post('/auth/register', {name: $('name').value, email: $('email').value, password: $('pw').value});
    localStorage.setItem('token', token);
    location.href = '/';
  } catch (e) { $('err').textContent = e.message; }
};
</script>
</main></body></html>
