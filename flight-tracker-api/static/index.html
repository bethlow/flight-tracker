<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Travels</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.card{margin-bottom:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 8px}
input,button,select{font:inherit;border-radius:10px;border:1px solid var(--line);padding:9px;background:var(--bg);color:var(--ink);min-width:0}
button.ghost{background:transparent;color:var(--mute);padding:4px 8px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input{flex:1 1 110px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}.stats b{display:block;font-size:22px}
.leg{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.leg:first-of-type{border-top:0}
.leg .r{font-weight:600}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tl{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
[hidden]{display:none!important}
#map{height:320px;border-radius:12px;background:var(--line)}
.card.highlight{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink)}
</style></head><body><main>

<div id="auth" class="card" hidden>
  <h1>Our Travels</h1><p class="sub">Sign in to your shared logbook.</p>
  <div class="row"><input id="email" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"></div>
  <p class="row"><button id="login">Sign in</button></p><div class="err" id="autherr"></div>
  <p class="sub">New here? <a href="/register.html">Create an account</a></p>
</div>

<div id="app" hidden>
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <div><h1 id="title"></h1><div class="sub" id="members"></div></div><button class="ghost" id="out">Sign out</button>
  </div>
  <div class="card row"><button id="invite">Invite partner</button><span id="code" class="sub"></span>
    <input id="joincode" placeholder="Have an invite code?" style="flex:0 1 170px"><button id="join" class="ghost">Join</button></div>
  <div class="card highlight" id="upcomingCard" hidden><h2>Upcoming trips</h2><div id="upcoming"></div></div>
  <div class="row" style="margin-bottom:12px"><label class="sub" for="yearSel">Year</label><select id="yearSel"></select></div>
  <div class="card stats" id="stats"></div>
  <div class="card"><h2>Map</h2><div id="map"></div></div>
  <div class="card two"><div><h2>Top routes</h2><div id="routes"></div></div><div><h2>Top airports</h2><div id="aps"></div></div></div>
  <form class="card" id="f"><h2 id="fh">Add a flight</h2>
    <div class="row"><input id="from" placeholder="From (BOS)" maxlength="3" required><input id="to" placeholder="To (LIS)" maxlength="3" required>
    <input id="date" type="date" required><input id="fn" placeholder="Flight # (optional)"><input id="note" placeholder="Note (optional)"></div>
    <p class="row"><button id="go">Save flight</button><button type="button" class="ghost" id="cancel" hidden>Cancel edit</button>
    <label class="sub">or import calendar (.ics): <input type="file" id="ics" accept=".ics"></label></p><div class="err" id="ferr"></div>
  </form>
  <div class="card">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">Flights</h2>
      <div class="row" style="gap:8px"><select id="sortSel"><option value="date_desc">Newest first</option><option value="date_asc">Oldest first</option><option value="dist_desc">Longest first</option></select>
      <button type="button" class="ghost" id="toggleLegs">Hide</button></div></div>
    <div id="legs"></div>
  </div>
</div>

<script src="/common.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let token = localStorage.getItem('token'), lb = null, year = '', sortBy = 'date_desc', legs = [], editing = null;
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

function signOut() { token = null; localStorage.removeItem('token'); $('app').hidden = true; $('auth').hidden = false; }
window.onUnauthorized = signOut;
$('login').onclick = async () => {
  $('autherr').textContent = '';
  try {
    token = (await post('/auth/login', {email: $('email').value, password: $('pw').value})).token;
    localStorage.setItem('token', token); start();
  } catch (e) { $('autherr').textContent = e.message; }
};
$('out').onclick = signOut;

async function start() {
  $('auth').hidden = true; $('app').hidden = false;
  const me = await api('/me'), book = me.logbooks[0]; lb = book.id;
  $('title').textContent = book.name;
  $('members').textContent = book.members.map(m => m.name).join(' & ');
  $('invite').hidden = book.role !== 'owner';
  refresh();
}
async function refresh() {
  const q = year ? '?year=' + year : '';
  const [s, l] = await Promise.all([api(`/logbooks/${lb}/stats${q}`), api(`/logbooks/${lb}/legs${q}`)]);
  legs = l;
  $('yearSel').innerHTML = ['', ...s.by_year.map(y => y.year).reverse()].map(y => `<option value="${y}" ${String(year) === String(y) ? 'selected' : ''}>${y || 'All'}</option>`).join('');
  const x = s.summary;
  $('stats').innerHTML = [[x.flights, 'flights'], [x.miles.toLocaleString(), 'miles'], [x.places, 'places'], [x.countries, 'countries'], [x.layovers, 'layovers']].map(([n, w]) => `<div><b>${n}</b><span class="sub">${w}</span></div>`).join('');
  const list = (rows, f) => rows.map(r => `<div class="tl"><span>${f(r)}</span><span class="sub">${r.flights || r.visits}×</span></div>`).join('') || '<span class="sub">None yet</span>';
  $('routes').innerHTML = list(s.top_routes, r => `${r.a} ↔ ${r.b}`); $('aps').innerHTML = list(s.top_airports, r => r.iata);
  renderLegs();
  renderUpcoming();
  renderMap(legs);
}

function renderUpcoming() {
  const t = today();
  const up = legs.filter(g => g.flight_date > t).sort((a, b) => a.flight_date.localeCompare(b.flight_date));
  $('upcomingCard').hidden = up.length === 0;
  $('upcoming').innerHTML = up.map(g => {
    const days = Math.round((new Date(g.flight_date) - new Date(t)) / 86400000);
    return `<div class="tl"><span>${esc(g.origin_city)} → ${esc(g.dest_city)} <span class="sub">${g.origin}–${g.dest}</span></span><span class="sub">${g.flight_date} · in ${days}d</span></div>`;
  }).join('');
}

const SORTS = {
  date_desc: (a, b) => b.flight_date.localeCompare(a.flight_date) || b.id - a.id,
  date_asc: (a, b) => a.flight_date.localeCompare(b.flight_date) || a.id - b.id,
  dist_desc: (a, b) => b.distance_mi - a.distance_mi,
};
function renderLegs() {
  const t = today();
  $('legs').innerHTML = [...legs].sort(SORTS[sortBy]).map(g => `<div class="leg"><div data-e="${g.id}" style="cursor:pointer;flex:1"><div class="r">${esc(g.origin_city)} → ${esc(g.dest_city)} <span class="sub">${g.origin}–${g.dest}</span></div>
    <div class="sub">${g.flight_date}${g.flight_number ? ' · ' + esc(g.flight_number) : ''}${g.note ? ' · ' + esc(g.note) : ''}${g.flight_date > t ? ' · upcoming' : ''}</div></div>
    <button class="ghost" data-d="${g.id}">✕</button></div>`).join('') || '<span class="sub">No flights yet. Add one above.</span>';
}
$('yearSel').onchange = () => { year = $('yearSel').value; refresh(); };
$('sortSel').onchange = () => { sortBy = $('sortSel').value; renderLegs(); };
$('toggleLegs').onclick = () => {
  $('legs').hidden = !$('legs').hidden;
  $('toggleLegs').textContent = $('legs').hidden ? 'Show' : 'Hide';
};

let map, mapLayer;
function renderMap(rows) {
  if (!map) {
    map = L.map('map', {scrollWheelZoom: false});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {attribution: '© OpenStreetMap contributors', maxZoom: 18}).addTo(map);
    mapLayer = L.layerGroup().addTo(map);
  }
  mapLayer.clearLayers();
  const t = today();
  const airports = new Map(), routes = new Map();
  for (const g of rows) {
    for (const [code, city, lat, lon] of [[g.origin, g.origin_city, g.origin_lat, g.origin_lon], [g.dest, g.dest_city, g.dest_lat, g.dest_lon]]) {
      const a = airports.get(code) || {city, lat, lon, visits: 0}; a.visits++; airports.set(code, a);
    }
    const key = [g.origin, g.dest].sort().join('-');
    const r = routes.get(key) || {count: 0, upcoming: false};
    r.count++; if (g.flight_date > t) r.upcoming = true;
    routes.set(key, r);
  }
  for (const [key, r] of routes) {
    const [a, b] = key.split('-').map(c => airports.get(c));
    L.polyline([[a.lat, a.lon], [b.lat, b.lon]], {color: r.upcoming ? '#ff9f1c' : '#2f6bff', weight: Math.min(1 + r.count, 6), opacity: 0.55}).addTo(mapLayer);
  }
  for (const [code, a] of airports) {
    L.circleMarker([a.lat, a.lon], {radius: 4 + Math.min(a.visits, 10), color: '#2f6bff', weight: 1, fillColor: '#2f6bff', fillOpacity: 0.5})
      .bindPopup(`<b>${esc(code)}</b> · ${esc(a.city)} · ${a.visits}×`).addTo(mapLayer);
  }
  if (airports.size) map.fitBounds([...airports.values()].map(a => [a.lat, a.lon]), {padding: [24, 24]});
  else map.setView([20, 0], 2);
}
document.addEventListener('click', async e => {
  const d = e.target.dataset; if (!d) return;
  try {
    if (d.d) {
      if (d.armed) { await api('/legs/' + d.d, {method: 'DELETE'}); refresh(); }
      else {
        d.armed = '1'; e.target.textContent = 'Delete?'; e.target.style.color = '#e5484d';
        clearTimeout(e.target._disarm);
        e.target._disarm = setTimeout(() => { delete d.armed; e.target.textContent = '✕'; e.target.style.color = ''; }, 3000);
      }
    }
  } catch (err) { alert(err.message); }
  const row = e.target.closest('[data-e]');
  if (row) { editing = legs.find(g => g.id == row.dataset.e); $('from').value = editing.origin; $('to').value = editing.dest; $('date').value = editing.flight_date;
    $('fn').value = editing.flight_number; $('note').value = editing.note; $('fh').textContent = 'Edit flight'; $('cancel').hidden = false; $('f').scrollIntoView({behavior: 'smooth'}); }
});
function resetForm() { editing = null; $('f').reset(); $('fh').textContent = 'Add a flight'; $('cancel').hidden = true; }
$('cancel').onclick = resetForm;
$('f').onsubmit = async e => {
  e.preventDefault(); $('ferr').textContent = '';
  const b = {origin: $('from').value, dest: $('to').value, flight_date: $('date').value, flight_number: $('fn').value, note: $('note').value};
  try {
    editing ? await api('/legs/' + editing.id, {method: 'PATCH', body: JSON.stringify(b)}) : await post(`/logbooks/${lb}/legs`, b);
    resetForm(); refresh();
  } catch (err) { $('ferr').textContent = err.message; }
};
$('ics').onchange = async e => {
  const fd = new FormData(); fd.append('file', e.target.files[0]);
  try {
    const r = await api(`/logbooks/${lb}/import-ics`, {method: 'POST', body: fd});
    $('ferr').textContent = `Imported ${r.added} flights (${r.duplicates} already there)` + (r.needs_review.length ? `; ${r.needs_review.length} need a look: ` + r.needs_review.slice(0, 3).map(n => n.summary).join(', ') : '');
    refresh();
  } catch (err) { $('ferr').textContent = err.message; }
  e.target.value = '';
};
$('invite').onclick = async () => { const r = await post(`/logbooks/${lb}/invites`, {}); $('code').textContent = 'Share this code (valid 7 days): ' + r.code; };
$('join').onclick = async () => {
  try { const r = await post(`/invites/${$('joincode').value.trim()}/accept`, {}); lb = r.logbook_id; start(); } catch (e) { alert(e.message); }
};
token ? start().catch(() => signOut()) : signOut();
</script></main></body></html>
